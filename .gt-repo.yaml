# Repository governance for gt. This file is the source of truth; run
# 'gt repo sync' to render it, and 'gt repo check' to verify.
#
# Shared policy (Dependabot cooldown, commit-message prefixes, the weekly sync
# schedule) lives in gt's templates, not here, so it stays consistent across
# every governed repo.
#
# The pipeline stages below become jobs in ci-orchestration.yml, each calling a
# ci-*/cd-* workflow that belongs to this repository: gt creates those once and
# never touches them again. Branch protection needs exactly one check, ci-gate,
# which waits on all of them.

gt_version: v1.0.0
dependabot:
  - ecosystem: github-actions
    directory: /
  - ecosystem: npm
    directory: /
    note: |
      A pnpm workspace (pnpm-workspace.yaml lists worker and page) with a
      SINGLE pnpm-lock.yaml at the root. This must stay one entry at the
      workspace ROOT: per-member entries for /page and /worker would edit only
      those package.json files, leave the root lockfile stale, and every PR
      would fail a frozen-lockfile install.
dependabot_auto_merge:
  enabled: true
  schedule: 0 1 * * *
  max_bump: minor
  delete_branch: true
bulwark:
  # On. There is no security scanning here today, so gt's stage is an addition
  # rather than a duplicate. Expect findings on the first run; nothing gates on
  # them while ci-gate is not the required check.
  enabled: true
pipeline:
  ci:
    enabled: true
    stages:
      - preflight
      - build
      - test
    merge_queue: false
  # Off. deploy.yml already ships from pushes to main rather than from tags, so
  # delivery here is not tag-shaped at all — turning CD on means deciding
  # whether that changes, not just moving jobs. verify-attestation also runs
  # with require: true, and no tree carries an attestation yet.
  cd:
    enabled: false
    stages:
      - preflight
      - publish
      - deploy
      - verify
    tags:
      - v*.*.*
conventional_commits:
  enabled: true
  scope: pr_title
  types:
    - feat
    - fix
    - docs
    - style
    - refactor
    - perf
    - test
    - build
    - ci
    - chore
    - revert
settings:
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  branch_protection:
    branch: main
    required_approvals: 0
    require_up_to_date: false
files:
  - sync
  - dependabot-auto-merge
