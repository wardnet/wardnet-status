# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again. It is called by
# ci-orchestration.yml and must keep `workflow_call`.
#
# Type-check and unit tests share one job so the install happens once.
#
name: ci-test

on:
  workflow_call:

permissions:
  contents: read
  # @wardnet/* resolve from GitHub Packages during install.
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # @wardnet/* resolve from GitHub Packages; the built-in token has packages:read.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Type-check
        run: pnpm type-check
      - name: Test
        run: pnpm test
