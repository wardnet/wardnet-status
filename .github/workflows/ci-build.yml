# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again. It is called by
# ci-orchestration.yml and must keep `workflow_call`.
#
# Validates topology.yaml against its schema.
#
name: ci-build

on:
  workflow_call:

permissions:
  contents: read
  # @wardnet/* resolve from GitHub Packages during install.
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install worker deps
        run: pnpm install --frozen-lockfile --filter @wardnet/status-worker
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate topology.yaml against the schema
        run: pnpm --filter @wardnet/status-worker exec vitest run test/topology-file.test.ts
